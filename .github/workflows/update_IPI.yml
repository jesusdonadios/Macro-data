
name: Update Eurostat Industrial Production

on:
  # Allow manual execution
  workflow_dispatch:

  # Automatic execution (at 07:17 Monday - Friday) 
  schedule:
    - cron: "17 7 * * 1-5"
      timezone: "Europe/Madrid"
  
# Allow the workflow to save updated data
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Access repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # 3. Install R packages
      - name: Install packages
        run: |
          install.packages(c("httr2", "readr", "dplyr"))
        shell: Rscript {0}

      # 4. Run Industrial Production script
      - name: Download Industrial Production data
        run: |
          source("1_Eurostat IP.R")

          dir.create("data", showWarnings = FALSE)

          readr::write_csv(IPI, "data/IPI.csv")
        shell: Rscript {0}

      # 5. Save updated CSV to GitHub
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/IPI.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update Eurostat Industrial Production"
            git push
          fi
